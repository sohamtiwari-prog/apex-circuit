name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: "4.3"
  GODOT_RELEASE: "stable"

jobs:
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Godot + export templates
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-${{ env.GODOT_RELEASE }}-v1

      - name: Download Godot and export templates
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          V="${GODOT_VERSION}-${GODOT_RELEASE}"
          BASE="https://github.com/godotengine/godot/releases/download/${V}"
          mkdir -p ~/godot
          curl -sSL -o /tmp/godot.zip "${BASE}/Godot_v${V}_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v${V}_linux.x86_64 ~/godot/godot
          curl -sSL -o /tmp/templates.tpz "${BASE}/Godot_v${V}_export_templates.tpz"
          unzip -q /tmp/templates.tpz -d /tmp/tpl
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_RELEASE}
          mv /tmp/tpl/templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_RELEASE}/

      - name: Configure Godot for Android
        run: |
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-${GODOT_VERSION}.tres <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "${ANDROID_HOME}"
          export/android/java_sdk_path = "${JAVA_HOME}"
          EOF
          sed -i 's/^ *//' ~/.config/godot/editor_settings-${GODOT_VERSION}.tres
          cat ~/.config/godot/editor_settings-${GODOT_VERSION}.tres

      - name: Import project
        run: timeout 300 ~/godot/godot --headless --import || true

      - name: Compile-check scripts
        run: bash .github/check_scripts.sh

      - name: Physics tests
        run: bash .github/run_test.sh res://tests/sim_test.gd

      - name: Game tests
        run: bash .github/run_test.sh res://tests/game_test.gd

      - name: Every track is drivable
        run: bash .github/run_test.sh res://tests/tracks_test.gd

      - name: Every car performs and laps cleanly
        run: bash .github/run_test.sh res://tests/cars_test.gd

      - name: Full 20-car race
        run: bash .github/run_test.sh res://tests/race_test.gd

      - name: No scenery on the road
        run: bash .github/run_test.sh res://tests/scenery_test.gd

      - name: Reset to track works
        run: bash .github/run_test.sh res://tests/reset_test.gd

      - name: Assists get a beginner round the lap
        run: bash .github/run_test.sh res://tests/assist_test.gd

      - name: Drag steering and assist levels
        run: bash .github/run_test.sh res://tests/touch_test.gd

      - name: Sectors, DRS and ghost car
        run: bash .github/run_test.sh res://tests/features_test.gd

      - name: No invisible walls at the track edge
        run: bash .github/run_test.sh res://tests/edge_test.gd

      - name: Start the online relay and a stand-in public server (for multiplayer tests)
        run: |
          cd server && npm install --no-audit --no-fund
          PORT=8090 nohup node relay.js > /tmp/relay.log 2>&1 &
          cd test-broker && npm install --no-audit --no-fund
          PORT=8091 nohup node broker.js > /tmp/broker.log 2>&1 &
          sleep 2 && curl -sf http://127.0.0.1:8090/ && echo " relay up" && cat /tmp/broker.log

      - name: Multiplayer connection tests
        run: timeout 300 ~/godot/godot --headless --script res://tests/net_test.gd -- ws://127.0.0.1:8090 ws://127.0.0.1:8091/mqtt

      - name: Multiplayer race over Wi-Fi (two phones)
        run: LOGDIR=/tmp bash tests/run_mp_test.sh ~/godot/godot lan

      - name: Multiplayer race online (two phones via relay)
        run: LOGDIR=/tmp bash tests/run_mp_test.sh ~/godot/godot online ws://127.0.0.1:8090

      - name: Multiplayer race online (two phones via the free public servers)
        run: LOGDIR=/tmp bash tests/run_mp_test.sh ~/godot/godot public ws://127.0.0.1:8091/mqtt

      - name: Barriers hold and Reset works on every track
        run: bash .github/run_test.sh res://tests/barrier_test.gd

      - name: Landscape never shows through the road or verges
        run: bash .github/run_test.sh res://tests/ground_test.gd

      - name: Driver ranking
        run: bash .github/run_test.sh res://tests/rank_test.gd

      - name: Export APK
        env:
          # The same key must sign every build, or Android refuses to update the
          # app (and you'd have to uninstall, losing progress). Never change it.
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: ${{ github.workspace }}/android_signing/release.keystore
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: apexcircuit
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: apexcircuit-release
        run: |
          VERSION_NAME="0.1.${{ github.run_number }}"
          sed -i "s/^version\/code=.*/version\/code=${{ github.run_number }}/" export_presets.cfg
          sed -i "s/^version\/name=.*/version\/name=\"${VERSION_NAME}\"/" export_presets.cfg
          mkdir -p build
          ~/godot/godot --headless --export-release "Android" build/apex-circuit.apk > export.log 2>&1 || true
          grep -v -e 'Parameter "m" is null' -e 'mesh_storage.h' -e '^$' export.log | tail -80
          if [ ! -s build/apex-circuit.apk ]; then
            grep -iE "error|invalid|missing|could not|failed" export.log | grep -v mesh_storage | head -20 | sed 's/^/::error title=export::/'
            exit 1
          fi
          ls -la build
          cp build/apex-circuit.apk "build/ApexCircuit-v${VERSION_NAME}.apk"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: Apex Circuit v0.1.${{ github.run_number }}
          body: |
            Automatic build from ${{ github.sha }}.

            **Install:** download `ApexCircuit-v0.1.${{ github.run_number }}.apk` below on your Android phone and open it.
            If the download is slow or fails, use the mirror: https://sohamtiwari-prog.github.io/apex-circuit/
            Updates install over the previous version and keep your progress.
          files: build/ApexCircuit-v0.1.${{ github.run_number }}.apk
          make_latest: true

      # Second download route: GitHub Pages (different servers from release
      # assets, which some networks struggle to reach). Only the newest build.
      - name: Build download page
        run: |
          V="0.1.${{ github.run_number }}"
          mkdir -p site
          cp "build/ApexCircuit-v${V}.apk" "site/ApexCircuit-v${V}.apk"
          cp "build/ApexCircuit-v${V}.apk" site/ApexCircuit.apk
          SIZE=$(python3 -c "import os;print('%.1f' % (os.path.getsize('site/ApexCircuit.apk')/1e6))")
          sed -e "s/__VERSION__/${V}/g" -e "s/__SIZE__/${SIZE}/g" -e "s/__DATE__/$(date -u +'%d %b %Y')/g" .github/pages/index.html > site/index.html
          touch site/.nojekyll

      - name: Publish download page
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
          force_orphan: true
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
