<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>Apex Circuit</title>
<style>
html, body, #canvas { margin: 0; padding: 0; border: 0; }
html, body { width: 100%; height: 100%; background: #0d0f14; }
body {
	color: #f2f2f2; overflow: hidden; touch-action: none; overscroll-behavior: none;
	-webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
	-webkit-tap-highlight-color: transparent;
	font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
}
#canvas { display: block; width: 100%; height: 100%; }
#canvas:focus { outline: none; }
.overlay { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 24px; box-sizing: border-box; }
#status { background: radial-gradient(ellipse at 50% 120%, #2a1406 0%, #0d0f14 60%); z-index: 2; }
.brand { font-weight: 800; letter-spacing: 0.12em; font-size: clamp(28px, 7vw, 56px); font-style: italic; }
.brand b { color: #ff6a1a; }
.sub { opacity: 0.6; margin-top: 6px; font-size: 14px; letter-spacing: 0.2em; text-transform: uppercase; }
#bar { width: min(420px, 70vw); height: 6px; border-radius: 3px; background: #262a33; margin-top: 28px; overflow: hidden; }
#bar i { display: block; height: 100%; width: 0%; background: #ff6a1a; transition: width 0.2s; }
#pct { margin-top: 10px; font-size: 13px; opacity: 0.6; }
#notice { display: none; margin-top: 20px; max-width: 520px; background: #3b1f24; border: 1px solid #9b3943; border-radius: 10px; padding: 14px; font-size: 14px; line-height: 1.4; }
#tip { display: none; margin-top: 22px; max-width: 440px; font-size: 14px; line-height: 1.45; background: #1b2029; border-radius: 10px; padding: 12px 14px; }
#tip b { color: #ff6a1a; }
#rotate { display: none; background: #0d0f14; z-index: 5; }
#rotate svg { width: 84px; height: 84px; margin-bottom: 18px; animation: tilt 2s ease-in-out infinite; }
@keyframes tilt { 0%, 30% { transform: rotate(0deg); } 60%, 100% { transform: rotate(-90deg); } }
@media (orientation: portrait) and (max-width: 900px) { #rotate.on { display: flex; } }
</style>
<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>
<link rel="manifest" href="index.manifest.json">

</head>
<body>
<canvas id="canvas">Your browser does not support the canvas tag.</canvas>
<noscript>Apex Circuit needs JavaScript.</noscript>

<div id="status" class="overlay">
	<div class="brand">APEX <b>CIRCUIT</b></div>
	<div class="sub">Loading the paddock</div>
	<div id="bar"><i></i></div>
	<div id="pct"></div>
	<div id="tip">Play full screen: tap <b>Share</b> then <b>Add to Home Screen</b>, and open Apex Circuit from there.</div>
	<div id="notice"></div>
</div>

<div id="rotate" class="overlay on">
	<svg viewBox="0 0 64 64" fill="none" stroke="#ff6a1a" stroke-width="3"><rect x="20" y="6" width="24" height="52" rx="5"/><circle cx="32" cy="50" r="2" fill="#ff6a1a"/></svg>
	<div class="brand" style="font-size:22px">TURN YOUR PHONE SIDEWAYS</div>
	<div class="sub" style="letter-spacing:0.05em;text-transform:none">Apex Circuit plays in landscape</div>
</div>

<script>
// ---- Phone tilt for steering (read by the game, scripts/web_bridge.gd:
// window.__apexAccX/Y/Z in screen axes, Android's convention). iOS asks
// permission on the first tap.
(function () {
	const iOS = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
	window.__apexIOS = iOS;
	window.__apexAccX = null; window.__apexAccY = 0; window.__apexAccZ = 0;
	function angle() {
		if (screen.orientation && typeof screen.orientation.angle === 'number') return screen.orientation.angle;
		return typeof window.orientation === 'number' ? window.orientation : 0;
	}
	function onMotion(ev) {
		const g = ev.accelerationIncludingGravity;
		if (!g || g.x === null) return;
		let x = g.x, y = g.y, z = g.z;
		if (iOS) { x = -x; y = -y; z = -z; }      // iOS reports the opposite sign
		const a = angle() * Math.PI / 180;
		const sx = x * Math.cos(a) + y * Math.sin(a);
		const sy = -x * Math.sin(a) + y * Math.cos(a);
		window.__apexAccX = sx; window.__apexAccY = sy; window.__apexAccZ = z;
	}
	window.addEventListener('devicemotion', onMotion);
	function ask() {
		if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
			DeviceMotionEvent.requestPermission().catch(() => {});
		}
		window.removeEventListener('touchend', ask);
		window.removeEventListener('click', ask);
	}
	window.addEventListener('touchend', ask);
	window.addEventListener('click', ask);
	// No pinch-zoom, double-tap zoom or long-press menus.
	document.addEventListener('gesturestart', (e) => e.preventDefault());
	document.addEventListener('dblclick', (e) => e.preventDefault());
	document.addEventListener('contextmenu', (e) => e.preventDefault());
	const standalone = window.navigator.standalone === true || window.matchMedia('(display-mode: fullscreen)').matches || window.matchMedia('(display-mode: standalone)').matches;
	if (iOS && !standalone) document.getElementById('tip').style.display = 'block';
	// "Turn sideways" only on phones and tablets.
	if (!('ontouchstart' in window) && navigator.maxTouchPoints === 0) document.getElementById('rotate').classList.remove('on');
}());
</script>

<script src="index.js"></script>
<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"ensureCrossOriginIsolationHeaders":false,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":9170848,"index.wasm":35376909},"focusCanvas":true,"gdextensionLibs":[],"serviceWorker":"index.service.worker.js"};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);
(function () {
	const status = document.getElementById('status');
	const bar = document.querySelector('#bar i');
	const pct = document.getElementById('pct');
	const notice = document.getElementById('notice');
	function fail(err) {
		console.error(err);
		notice.textContent = (err && err.message) ? err.message : String(err);
		notice.style.display = 'block';
	}
	const missing = Engine.getMissingFeatures({ threads: GODOT_THREADS_ENABLED });
	if (missing.length !== 0) {
		fail('This browser is missing what the game needs:\n' + missing.join(', ') + '\nTry the latest Safari or Chrome.');
		return;
	}
	engine.startGame({
		onProgress: function (current, total) {
			if (current > 0 && total > 0) {
				const p = Math.min(100, Math.round(current / total * 100));
				bar.style.width = p + '%';
				pct.textContent = p < 100 ? p + '%  (' + (total / 1e6).toFixed(0) + ' MB, first time only)' : 'Starting...';
			}
		},
	}).then(() => { status.remove(); }, fail);
}());
</script>
</body>
</html>
