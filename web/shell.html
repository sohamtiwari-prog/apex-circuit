<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Apex Circuit">
<meta name="theme-color" content="#d3d7dc">
<title>Apex Circuit</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@125,800&family=Barlow+Semi+Condensed:wght@600&display=swap" rel="stylesheet">
<style>
html, body, #canvas { margin: 0; padding: 0; border: 0; }
html, body { width: 100%; height: 100%; background: #d3d7dc; }
body {
	color: #000; overflow: hidden; touch-action: none; overscroll-behavior: none;
	-webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
	-webkit-tap-highlight-color: transparent;
	font-family: "Barlow Semi Condensed", -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
}
#canvas { display: block; width: 100%; height: 100%; }
#canvas:focus { outline: none; }
.overlay { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 24px; box-sizing: border-box; }
#status { background: #d3d7dc; z-index: 2; }
.brand { font: 800 clamp(26px, 6vw, 48px)/1.1 "Archivo", system-ui, sans-serif; font-stretch: 125%; }
.sub { color: #5a6169; margin-top: 6px; font-size: 17px; }
#bar { width: min(420px, 70vw); height: 8px; background: #ffffff; margin-top: 28px; overflow: hidden; }
#bar i { display: block; height: 100%; width: 0%; background: #000; transition: width 0.2s; }
#pct { margin-top: 10px; font-size: 15px; color: #5a6169; }
#notice { display: none; margin-top: 20px; max-width: 520px; background: #fff; border-left: 6px solid #d4261c; padding: 14px; font-size: 16px; line-height: 1.4; text-align: left; }
#tip { display: none; margin-top: 22px; max-width: 440px; font-size: 16px; line-height: 1.45; background: #fff; padding: 12px 14px; }
#tip b { background: #ffd200; padding: 0 3px; }
#rotate { display: none; background: #d3d7dc; z-index: 5; }
#rotate svg { width: 84px; height: 84px; margin-bottom: 18px; animation: tilt 2s ease-in-out infinite; }
@keyframes tilt { 0%, 30% { transform: rotate(0deg); } 60%, 100% { transform: rotate(-90deg); } }
@media (orientation: portrait) and (max-width: 900px) { #rotate.on { display: flex; } }
/* Typing: a real text box in a bar across the top, above the keyboard. */
#textbar { display: none; position: fixed; left: 0; right: 0; top: 0; z-index: 10; background: #fff;
	padding: 10px max(12px, env(safe-area-inset-right)) 10px max(12px, env(safe-area-inset-left));
	box-shadow: 0 4px 0 rgba(0,0,0,0.25); gap: 10px; align-items: center; }
#textbar.on { display: flex; }
#textbar input { flex: 1; min-width: 0; font: 600 20px "Barlow Semi Condensed", -apple-system, sans-serif;
	padding: 10px 12px; border: 0; border-bottom: 4px solid #ffd200; background: #e4e7ea; color: #000;
	border-radius: 2px; -webkit-user-select: text; user-select: text; }
#textbar input:focus { outline: none; }
#textbar button { font: 800 18px "Archivo", -apple-system, sans-serif; font-stretch: 125%; border: 0;
	background: #00a04a; color: #fff; padding: 12px 18px; border-radius: 2px; }
</style>
$GODOT_HEAD_INCLUDE
</head>
<body>
<canvas id="canvas">Your browser does not support the canvas tag.</canvas>
<noscript>Apex Circuit needs JavaScript.</noscript>

<div id="status" class="overlay">
	<div class="brand">Apex Circuit</div>
	<div class="sub">Opening the garage</div>
	<div id="bar"><i></i></div>
	<div id="pct"></div>
	<div id="tip">Play full screen: tap <b>Share</b> then <b>Add to Home Screen</b>, and open Apex Circuit from there.</div>
	<div id="notice"></div>
</div>

<div id="textbar"><input id="textin" type="text" autocomplete="off" autocorrect="off" autocapitalize="words" spellcheck="false" enterkeyhint="done"><button id="textdone" type="button">Done</button></div>

<div id="rotate" class="overlay on">
	<svg viewBox="0 0 64 64" fill="none" stroke="#000" stroke-width="3"><rect x="20" y="6" width="24" height="52" rx="5"/><circle cx="32" cy="50" r="2" fill="#000"/></svg>
	<div class="brand" style="font-size:22px">Turn your phone sideways</div>
	<div class="sub">Apex Circuit plays in landscape</div>
</div>

<script>
// ---- Phone tilt for steering (read by the game, scripts/web_bridge.gd:
// window.__apexAccX/Y/Z in screen axes, Android's convention). iOS asks
// permission on the first tap.
(function () {
	const iOS = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
	window.__apexIOS = iOS;
	window.__apexAccX = null; window.__apexAccY = 0; window.__apexAccZ = 0;
	function angle() {
		if (screen.orientation && typeof screen.orientation.angle === 'number') return screen.orientation.angle;
		return typeof window.orientation === 'number' ? window.orientation : 0;
	}
	function onMotion(ev) {
		const g = ev.accelerationIncludingGravity;
		if (!g || g.x === null) return;
		let x = g.x, y = g.y, z = g.z;
		if (iOS) { x = -x; y = -y; z = -z; }      // iOS reports the opposite sign
		const a = angle() * Math.PI / 180;
		const sx = x * Math.cos(a) + y * Math.sin(a);
		const sy = -x * Math.sin(a) + y * Math.cos(a);
		window.__apexAccX = sx; window.__apexAccY = sy; window.__apexAccZ = z;
	}
	window.addEventListener('devicemotion', onMotion);
	function ask() {
		if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
			DeviceMotionEvent.requestPermission().catch(() => {});
		}
		window.removeEventListener('touchend', ask);
		window.removeEventListener('click', ask);
	}
	window.addEventListener('touchend', ask);
	window.addEventListener('click', ask);
	// No pinch-zoom, double-tap zoom or long-press menus.
	document.addEventListener('gesturestart', (e) => e.preventDefault());
	document.addEventListener('dblclick', (e) => e.preventDefault());
	document.addEventListener('contextmenu', (e) => e.preventDefault());
	const standalone = window.navigator.standalone === true || window.matchMedia('(display-mode: fullscreen)').matches || window.matchMedia('(display-mode: standalone)').matches;
	window.__apexStandalone = standalone;
	// Sound with the ring/silent switch on silent too (Safari 17+): it's a game.
	try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}
	// Draw at no more than 1.5 pixels per point on an iPhone (2 elsewhere): a
	// 3x screen is 9x the pixels of 1x, far more than WebGL on a phone can
	// fill at racing frame rates, for sharpness you can't see at speed.
	const dpr = window.devicePixelRatio || 1;
	const cap = iOS ? 1.5 : 2;
	if (dpr > cap) {
		try { Object.defineProperty(window, 'devicePixelRatio', { get: () => cap, configurable: true }); } catch (e) {}
	}
	// Typing (scripts/web_bridge.gd edit_text): the game opens this bar with
	// the field's text; every change goes back to the game, Done closes it.
	const bar = document.getElementById('textbar');
	const box = document.getElementById('textin');
	let cb = null;
	function send(done) { if (cb) cb(box.value, done); }
	function close() { send(true); bar.classList.remove('on'); box.blur(); cb = null; const c = document.getElementById('canvas'); if (c) c.focus(); }
	box.addEventListener('input', () => send(false));
	box.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); close(); } });
	// The game listens for keys on the whole page (and stops their default,
	// which is typing): keys meant for the box go no further than the box.
	for (const t of ['keydown', 'keyup', 'keypress']) {
		window.addEventListener(t, (e) => { if (e.target === box) e.stopImmediatePropagation(); }, true);
	}
	// Likewise taps on the bar: the game would take them (and the focus).
	for (const t of ['touchstart', 'touchend', 'touchmove', 'mousedown', 'mouseup', 'pointerdown', 'pointerup']) {
		window.addEventListener(t, (e) => { if (bar.contains(e.target)) e.stopImmediatePropagation(); }, true);
	}
	document.getElementById('textdone').addEventListener('click', close);
	// The engine's own hidden typing box hands the focus back to the game
	// when it loses it, which would take it straight off ours: not while
	// the bar is open.
	function tameIme() {
		const host = document.getElementById('canvas').parentElement;
		for (const el of host.children) {
			if (el.tagName === 'DIV' && typeof el.onblur === 'function' && !el.__apexTamed) {
				const orig = el.onblur;
				el.onblur = function (e) {
					if (bar.classList.contains('on')) { this.style.display = 'none'; return; }
					return orig.call(this, e);
				};
				el.__apexTamed = true;
			}
		}
	}
	window.__apexText = {
		open: function (text, placeholder, maxLen, callback) {
			tameIme();
			cb = callback;
			box.value = text || '';
			box.placeholder = placeholder || 'Type here';
			if (maxLen > 0) box.maxLength = maxLen; else box.removeAttribute('maxLength');
			bar.classList.add('on');
			box.focus();
			try { box.setSelectionRange(box.value.length, box.value.length); } catch (e) {}
		},
	};
	if (iOS && !standalone) document.getElementById('tip').style.display = 'block';
	// "Turn sideways" only on phones and tablets.
	if (!('ontouchstart' in window) && navigator.maxTouchPoints === 0) document.getElementById('rotate').classList.remove('on');
}());
</script>

<script src="$GODOT_URL"></script>
<script>
const GODOT_CONFIG = $GODOT_CONFIG;
const GODOT_THREADS_ENABLED = $GODOT_THREADS_ENABLED;
const engine = new Engine(GODOT_CONFIG);
(function () {
	const status = document.getElementById('status');
	const bar = document.querySelector('#bar i');
	const pct = document.getElementById('pct');
	const notice = document.getElementById('notice');
	function fail(err) {
		console.error(err);
		notice.textContent = (err && err.message) ? err.message : String(err);
		notice.style.display = 'block';
	}
	const missing = Engine.getMissingFeatures({ threads: GODOT_THREADS_ENABLED });
	if (missing.length !== 0) {
		fail('This browser is missing what the game needs:\n' + missing.join(', ') + '\nTry the latest Safari or Chrome.');
		return;
	}
	engine.startGame({
		onProgress: function (current, total) {
			if (current > 0 && total > 0) {
				const p = Math.min(100, Math.round(current / total * 100));
				bar.style.width = p + '%';
				pct.textContent = p < 100 ? p + '%  (' + (total / 1e6).toFixed(0) + ' MB, first time only)' : 'Starting...';
			}
		},
	}).then(() => { status.remove(); }, fail);
}());
</script>
</body>
</html>
